name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Build and Release
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install versatiles_glyphs
        run: |
          curl -Ls \
            "https://github.com/versatiles-org/versatiles-glyphs-rs/raw/refs/heads/main/scripts/install.sh" \
            | sh

      # Get latest release tag and store the tag name (e.g. "v1.2.3") in RELEASE_TAG.
      - name: Get Version
        id: get_tag
        run: echo "RELEASE_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')" >> $GITHUB_ENV

      # Builds with and without --link-duplicates must extract to identical files.
      - name: Verify hardlinked archives
        run: npm run verify-links -- --sample

      - name: Build fonts
        run: npm run build

      # Upload files to the existing (pre)release
      - name: Upload files to release
        run: gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/*.tar.zst --clobber
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      # Name the versatiles_glyphs release the archives were built with, so the
      # dependency graph can report when a newer one means they need a rebuild.
      # A rerun replaces the section instead of adding a second one.
      - name: Add components to release notes
        run: |
          GLYPHS_VERSION=$(versatiles_glyphs --version | awk '{print $2}')
          NOTES="${RUNNER_TEMP}/notes.md"
          gh release view "${RELEASE_TAG}" --json body -q .body | sed '/^## Components$/,$d' > "${NOTES}"
          printf '\n## Components\n\n- [VersaTiles Glyphs v%s](https://github.com/versatiles-org/versatiles-glyphs-rs)\n' "${GLYPHS_VERSION}" >> "${NOTES}"
          gh release edit "${RELEASE_TAG}" --notes-file "${NOTES}"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      # Publish the release (remove draft, prerelease flags, etc.)
      - name: Publish release
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest --prerelease=false
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
